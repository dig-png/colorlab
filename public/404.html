<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>ColorLab</title>
    <script>
      // SPA-фолбэк для GitHub Pages: сохраняем путь в query и уходим на index.html.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body>
    <p>Перенаправление…</p>
  </body>
</html>
